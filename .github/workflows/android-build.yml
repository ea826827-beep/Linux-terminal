
name: KALI MOBILE Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KALI MOBILE APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Download project source
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Gradle 8.4 directly
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.4'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 5. Install Android SDK 34
      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platform-tools"

      # 6. Check Gradle
      - name: Check Gradle Version
        run: gradle --version

      # 7. Build APK without Gradle Wrapper
      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      # 8. Verify APK
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 9. Upload APK
      - name: Upload KALI MOBILE APK
        uses: actions/upload-artifact@v4
        with:
          name: KALI-MOBILE-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
